<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- play triangle cut out of the button so the background shows through -->
    <mask id="play">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M470 446 L470 578 L584 512 Z" fill="#000" stroke="#000" stroke-width="24" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- macOS-style squircle with margin so it lines up with other Dock icons (same as Clumsee) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- selection corners: a box whose sides never meet -->
  <g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 400 V260 H400"/>
    <path d="M624 260 H764 V400"/>
    <path d="M764 624 V764 H624"/>
    <path d="M400 764 H260 V624"/>
  </g>
  <!-- video play button -->
  <rect x="340" y="392" width="344" height="240" rx="72" fill="#fff" mask="url(#play)"/>
</svg>

[package]
name = "clumyoup"
version = "0.1.0"
description = "Bulk schedule YouTube uploads from a folder"
authors = ["Adam <adamwahyu875@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "clumyoup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
ureq = { version = "3.5", features = ["json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
